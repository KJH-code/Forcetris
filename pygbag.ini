; What the browser build leaves out.
;
; pygbag packages the whole folder, which would otherwise put the test suite and
; the sound generator into every page load. Neither can run in a tab - the tests
; need a subprocess and a writable disk, and the generator writes wav files - so
; they are weight the player downloads and never uses.
[DEPENDENCIES]
ignoreDirs = ["tools", "screenshots", "data"]
ignoreFiles = []
